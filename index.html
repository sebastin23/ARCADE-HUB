<!DOCTYPE html>
<html lang="es" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Arcade Hub</title>
<style>
:root{--bg:#0b1020;--fg:#f4f7fb;--mut:#9aa7c7;--ac:#ff3b5c;--go:#ffc53a;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--bar:rgba(10,14,26,.78)}
[data-theme=cyber]{--bg:#050816;--ac:#00e5ff;--go:#b05cff}
[data-theme=mint]{--bg:#07140f;--ac:#2ee6a6;--go:#d9ff5a}
[data-theme=light]{--bg:#eef1f8;--fg:#12172b;--mut:#5a6486;--ac:#e8234a;--go:#f0a800;--card:rgba(255,255,255,.75);--bd:rgba(18,23,43,.15);--bar:rgba(255,255,255,.8)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .4s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(900px 600px at 50% 35%,var(--c1,#ff3b5c),transparent 65%),radial-gradient(800px 500px at 90% 100%,var(--c2,#ffc53a),transparent 60%);opacity:.38;transition:opacity .5s}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{display:flex;align-items:center;gap:14px;padding:16px 22px}
.logo{font-size:26px;font-weight:900;letter-spacing:3px;font-style:italic;background:linear-gradient(90deg,var(--ac),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px}
.tabs button{background:none;border:0;border-radius:999px;padding:7px 16px;font-weight:700;opacity:.7}
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--go));color:#111;opacity:1}
.ic{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-size:18px}
#rail{flex:1;min-height:0;display:flex;align-items:center;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50vw - 130px);scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.cd{flex:none;width:260px;height:min(340px,46vh);scroll-snap-align:center;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;transform:scale(.82);opacity:.55;transition:transform .25s,opacity .25s,box-shadow .25s;cursor:pointer;border:2px solid transparent}
.cd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.cd.on{transform:scale(1.06);opacity:1;border-color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 40px var(--c1)}
.cd .em{font-size:96px;z-index:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.cd img{width:62%;z-index:1;border-radius:26px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.cd .bdg{position:absolute;left:12px;top:12px;z-index:2;background:var(--go);color:#111;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px}
.cd .fv{position:absolute;right:10px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:18px}
.cd .fv.on{color:var(--go)}
#info{padding:6px 22px 14px;max-width:760px;margin:0 auto;text-align:center;width:100%}
#info h2{margin:0 0 6px;font-size:clamp(26px,5vw,40px);letter-spacing:1px}
#info .tg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
#info .tg i{font-style:normal;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--bd)}
#info p{margin:0 auto 8px;color:var(--mut);line-height:1.45;font-size:15px;max-width:60ch}
#info .ct{font-size:12px;color:var(--mut);margin-bottom:12px}
.btn{background:linear-gradient(135deg,var(--ac),var(--go));color:#111;border:0;border-radius:999px;padding:13px 40px;font-size:18px;font-weight:900;letter-spacing:1px;box-shadow:0 8px 26px rgba(0,0,0,.35);transition:transform .15s}
.btn:hover{transform:scale(1.05)}
.hint{text-align:center;color:var(--mut);font-size:12px;padding:0 0 12px}
.empty{margin:auto;color:var(--mut)}
/* overlays */
#boot,#ld{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#2a1250,#070a16 70%);color:#f4f7fb;transition:opacity .4s}
#ld{position:absolute;z-index:2}
#boot.off,#ld.off{opacity:0;pointer-events:none}
.bl{font-size:44px;font-weight:900;letter-spacing:6px;font-style:italic;background:linear-gradient(90deg,var(--ac),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
.em2{font-size:64px;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}
.pb{width:min(300px,70vw);height:8px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--go));transition:width .2s}
.tip{font-size:13px;color:#9aa7c7;min-height:18px;text-align:center;padding:0 20px}
#set{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#set.on{display:flex}
#set .pn{background:var(--bar);border:1px solid var(--bd);border-radius:20px;padding:22px;width:min(380px,92vw);backdrop-filter:blur(12px)}
#set h3{margin:0 0 14px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.sg{display:flex;gap:6px}
.sg button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-weight:700}
.sg button.on{background:var(--go);color:#111;border-color:transparent}
.sw{width:26px!important;height:26px;padding:0!important;border-radius:50%!important}
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
#player.on{display:block}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#tab{position:absolute;left:0;top:50%;transform:translate(calc(-100% + 18px),-50%);z-index:5;display:flex;gap:6px;padding:8px 8px 8px 10px;border-radius:0 14px 14px 0;background:rgba(10,14,26,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-left:0;transition:.25s;opacity:.55}
#tab.open,#tab:hover{transform:translate(0,-50%);opacity:1}
#tab button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:9px 12px;font-size:15px}
#tab:not(.open):not(:hover) button{pointer-events:none}
@media (max-width:520px){.top{padding:12px}.logo{font-size:20px}.tabs button{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div class="top"><div class="logo">ARCADE HUB</div>
    <div class="tabs"><button id="t_all" data-f="all"></button><button id="t_fav" data-f="fav"></button></div>
    <button class="ic" id="cfg" aria-label="Ajustes">⚙</button></div>
  <div id="rail"></div>
  <div id="info"><h2 id="in"></h2><div class="tg" id="it"></div><p id="id"></p><div class="ct" id="ic"></div><button class="btn" id="go"></button></div>
  <div class="hint" id="hint"></div>
</div>

<div id="set"><div class="pn"><h3 id="s_t"></h3>
  <div class="rw"><span id="s_l"></span><div class="sg"><button data-lang="es">ES</button><button data-lang="en">EN</button></div></div>
  <div class="rw"><span id="s_th"></span><div class="sg" id="ths"></div></div>
  <div class="rw"><span id="s_fx"></span><div class="sg"><button id="b_fx"></button></div></div>
  <div class="rw"><span id="s_mu"></span><div class="sg"><button id="b_mu"></button></div></div>
  <div class="rw"><span></span><button class="btn" id="s_x" style="padding:8px 24px;font-size:15px"></button></div></div></div>

<div id="player"><div id="ld"><div class="em2" id="le"></div><div id="ln" style="font-weight:800;letter-spacing:2px"></div><div class="pb"><i id="lb"></i></div><div class="tip" id="lt"></div></div>
  <iframe id="frame" title="Juego" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"></iframe>
  <div id="tab"><button id="bk"></button><button id="rl">↻</button><button id="fs">⛶</button></div></div>

<div id="boot"><div class="bl">ARCADE HUB</div><div class="pb"><i id="bf"></i></div><div class="tip" id="bt"></div></div>

<script src="games.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),G=window.GAMES||[],KEY='arcadehub.v1';
const D={lang:/^en/i.test(navigator.language)?'en':'es',theme:'neon',sfx:true,mus:false};
let ST={fav:[],last:'',plays:{},cfg:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(ST,s)}catch(e){}
ST.cfg=Object.assign({},D,ST.cfg);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));localStorage.setItem('arcadehub.lang',ST.cfg.lang);localStorage.setItem('arcadehub.theme',ST.cfg.theme)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={es:{all:'Todos',fav:'⭐ Favoritos',play:'▶ JUGAR',load:'Cargando',set:'Ajustes',lang:'Idioma',theme:'Tema',fx:'Efectos',mu:'Música',on:'Sí',off:'No',ok:'Listo',back:'← Juegos',played:n=>'Jugado '+n+(n==1?' vez':' veces'),never:'Sin jugar aún',ctl:'Controles',hint:'← → elegir · Enter jugar · F favorito · mando compatible',none:'Aún no tienes favoritos ⭐',tips:['Pulsa F para marcar un favorito','Funciona con mando y táctil','Tu progreso se guarda en este navegador','Mueve el ratón al borde izquierdo para volver']},
en:{all:'All',fav:'⭐ Favorites',play:'▶ PLAY',load:'Loading',set:'Settings',lang:'Language',theme:'Theme',fx:'Sound effects',mu:'Music',on:'On',off:'Off',ok:'Done',back:'← Games',played:n=>'Played '+n+(n==1?' time':' times'),never:'Not played yet',ctl:'Controls',hint:'← → choose · Enter play · F favorite · gamepad supported',none:'No favorites yet ⭐',tips:['Press F to favorite a game','Works with gamepad and touch','Your progress is saved in this browser','Move the mouse to the left edge to go back']}};
const E={'fuga-3d':['Escape from police, helicopters, tanks and even Godzilla. Turret, nitro, traffic, power-ups, 10 modes, cars and skins.','W/S accelerate · ←/→ steer · A / click turret · Shift nitro · Space brake'],'orbe-runner':['Hop across floating islands, collect coins, stomp enemies and reach the portal without falling in the lava.','WASD move · Space jump (double) · Shift dash · Q/E or drag: camera'],'demolicion-3d':['Knock down the structures with your cannon and destroy every red ball. Normal, heavy and bomb ammo.','Mouse aim · hold click to charge, release · 1/2/3 ammo'],'pelotation':['First-person shooting: topple every crate with realistic physics.','WASD move · mouse look · click/Space shoot · R restart'],'snake':['The classic snake with a shop, gold and upgrades.','Arrows / WASD or swipe'],'survival-shooter':['Survive waves of enemies and bosses, level up and upgrade your gear in the shop.','Gamepad or keyboard · Q bomb · E cross attack · C chest · L legendary chest'],'saltation':['A 3D jump-rope game in a rusty harbour. Jump clean, grow stronger and unlock ropes and skins.','Space or tap to jump · hold for a high jump']};
const t=k=>T[ST.cfg.lang][k],gd=g=>ST.cfg.lang==='en'&&E[g.id]?E[g.id][0]:g.desc,gc=g=>ST.cfg.lang==='en'&&E[g.id]?E[g.id][1]:g.controls;
const THS={neon:'#ff3b5c',cyber:'#00e5ff',mint:'#2ee6a6',light:'#eef1f8'};
let view='all',idx=0,cur=null,list=[];
/* audio */
let ac,mt,st=0;
const A=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
const tone=(f,d,ty='square',v=.05)=>{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)};
const sfx=k=>{if(!ST.cfg.sfx)return;try{A()}catch(e){return}if(k==='m')tone(520,.06);else if(k==='ok'){tone(660,.08);setTimeout(()=>tone(990,.14),70)}else tone(880,.1,'triangle')};
const SC=[220,261.6,329.6,392,329.6,261.6,196,246.9];
function music(){clearInterval(mt);if(ST.cfg.mus&&!cur){try{A()}catch(e){return}mt=setInterval(()=>{const n=st++;tone(SC[n%8]*(n%32<16?1:1.335),.28,'triangle',.035)},300)}}
/* ui */
function texts(){document.documentElement.lang=ST.cfg.lang;document.documentElement.dataset.theme=ST.cfg.theme;
 $('t_all').textContent=t('all');$('t_fav').textContent=t('fav');$('go').textContent=t('play');$('hint').textContent=t('hint');
 $('s_t').textContent=t('set');$('s_l').textContent=t('lang');$('s_th').textContent=t('theme');$('s_fx').textContent=t('fx');$('s_mu').textContent=t('mu');$('s_x').textContent=t('ok');
 $('b_fx').textContent=ST.cfg.sfx?t('on'):t('off');$('b_mu').textContent=ST.cfg.mus?t('on'):t('off');$('bk').textContent=t('back');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===view));
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===ST.cfg.lang));
 $('ths').innerHTML=Object.keys(THS).map(k=>`<button class="sw${k===ST.cfg.theme?' on':''}" data-th="${k}" style="background:${THS[k]}" aria-label="${k}"></button>`).join('');
 document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}
function render(keep){
 list=G.filter(g=>view==='all'||ST.fav.includes(g.id));
 $('rail').innerHTML=list.length?list.map((g,i)=>{const c=g.colors||['#ff3b5c','#ffc53a'];
  return `<article class="cd" data-i="${i}" style="--c1:${c[0]};--c2:${c[1]}">${g.badge?`<span class="bdg">${esc(g.badge)}</span>`:''}<button class="fv${ST.fav.includes(g.id)?' on':''}" data-fv="${i}" aria-label="Fav">${ST.fav.includes(g.id)?'★':'☆'}</button>${g.img?`<img src="${esc(g.img)}" alt="">`:`<span class="em">${esc(g.emoji||'🎮')}</span>`}</article>`}).join(''):`<div class="empty">${t('none')}</div>`;
 if(!keep){const l=list.findIndex(g=>g.id===ST.last);idx=l>=0?l:0}
 idx=Math.min(idx,Math.max(0,list.length-1));sel(idx,true)}
function sel(i,instant){idx=i;const g=list[i],cs=document.querySelectorAll('.cd');
 cs.forEach((c,k)=>c.classList.toggle('on',k===i));
 $('info').style.visibility=g?'visible':'hidden';if(!g)return;
 const c=g.colors||['#ff3b5c','#ffc53a'],n=ST.plays[g.id]||0;
 $('bg').style.setProperty('--c1',c[0]);$('bg').style.setProperty('--c2',c[1]);
 $('in').textContent=(g.emoji&&!g.img?g.emoji+' ':'')+g.name;$('it').innerHTML=(g.tags||[]).map(x=>`<i>${esc(x)}</i>`).join('');
 $('id').textContent=gd(g);$('ic').textContent='🎮 '+gc(g)+' · '+(n?t('played')(n):t('never'));
 const el=cs[i];if(el)el.scrollIntoView({behavior:instant?'auto':'smooth',inline:'center',block:'nearest'})}
function move(d){if(!list.length)return;const n=Math.max(0,Math.min(list.length-1,idx+d));if(n!==idx){sel(n);sfx('m')}}
let sc=0;$('rail').addEventListener('scroll',()=>{cancelAnimationFrame(sc);sc=requestAnimationFrame(()=>{const r=$('rail'),m=r.scrollLeft+r.clientWidth/2;let b=0,bd=1e9;r.querySelectorAll('.cd').forEach((c,k)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-m);if(d<bd){bd=d;b=k}});if(b!==idx&&list[b]){idx=b;document.querySelectorAll('.cd').forEach((c,k)=>c.classList.toggle('on',k===b));sel(b,true)}})});
$('rail').addEventListener('click',e=>{const f=e.target.closest('[data-fv]');if(f){e.stopPropagation();fav(list[+f.dataset.fv].id);return}const c=e.target.closest('.cd');if(c){const i=+c.dataset.i;if(i===idx)play();else{sel(i);sfx('m')}}});
function fav(id){ST.fav=ST.fav.includes(id)?ST.fav.filter(x=>x!==id):[...ST.fav,id];save();sfx('f');render(true)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.f;texts();render();sfx('m')});
/* loader */
let lp=0,lt=0,tt=0;
function showLoad(g){$('le').textContent=g.emoji||'🎮';$('ln').textContent=g.name.toUpperCase();$('ld').classList.remove('off');lp=5;$('lb').style.width='5%';
 const tips=T[ST.cfg.lang].tips;$('lt').textContent=tips[Math.floor(Math.random()*tips.length)];
 clearInterval(lt);lt=setInterval(()=>{lp+=(88-lp)*.08;$('lb').style.width=lp+'%'},120)}
function doneLoad(){clearInterval(lt);$('lb').style.width='100%';setTimeout(()=>$('ld').classList.add('off'),300)}
/* player */
const frame=$('frame'),player=$('player'),tab=$('tab');
const lf=u=>{try{frame.contentWindow.location.replace(new URL(u,location.href).href)}catch(e){frame.src=u}};
function play(){const g=list[idx];if(g){sfx('ok');location.hash='#/'+g.id}}
function openGame(g){cur=g;clearInterval(mt);ST.last=g.id;ST.plays[g.id]=(ST.plays[g.id]||0)+1;save();showLoad(g);
 document.title=g.name+' · Arcade Hub';player.classList.add('on');
 frame.onload=()=>{doneLoad();try{frame.contentWindow.focus()}catch(e){}};lf(encodeURIComponent(g.id)+'.html');
 tab.classList.add('open');clearTimeout(tabT);tabT=setTimeout(()=>tab.classList.remove('open'),2800)}
let tabT=0;
function closeGame(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});player.classList.remove('on');frame.onload=null;lf('about:blank');cur=null;clearInterval(lt);document.title='Arcade Hub';render();music()}
function route(){const m=location.hash.match(/^#\/(.+)$/),g=m&&G.find(x=>x.id===decodeURIComponent(m[1]));if(g){if(!cur||cur.id!==g.id)openGame(g)}else if(cur)closeGame()}
addEventListener('hashchange',route);
$('bk').onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search);route()}catch(e){location.hash=''}};
$('rl').onclick=()=>{if(cur){showLoad(cur);lf(encodeURIComponent(cur.id)+'.html')}};
if(document.fullscreenEnabled)$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():player.requestFullscreen().catch(()=>{})};else $('fs').style.display='none';
tab.addEventListener('pointerenter',()=>clearTimeout(tabT));tab.addEventListener('pointerleave',()=>{tabT=setTimeout(()=>tab.classList.remove('open'),1200)});
$('go').onclick=play;
/* settings */
$('cfg').onclick=()=>{$('set').classList.add('on');sfx('m')};
const closeS=()=>$('set').classList.remove('on');$('s_x').onclick=closeS;$('set').onclick=e=>{if(e.target===$('set'))closeS()};
$('set').addEventListener('click',e=>{const l=e.target.closest('[data-lang]'),h=e.target.closest('[data-th]');
 if(l)ST.cfg.lang=l.dataset.lang;if(h)ST.cfg.theme=h.dataset.th;if(e.target.id==='b_fx')ST.cfg.sfx=!ST.cfg.sfx;if(e.target.id==='b_mu'){ST.cfg.mus=!ST.cfg.mus;music()}
 if(l||h||e.target.id==='b_fx'||e.target.id==='b_mu'){save();texts();sel(idx,true);sfx('f')}});
/* input */
addEventListener('keydown',e=>{if(player.classList.contains('on'))return;if($('set').classList.contains('on')){if(e.key==='Escape')closeS();return}
 if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key==='Enter'){e.preventDefault();play()}else if(e.key==='f'||e.key==='F'){if(list[idx])fav(list[idx].id)}});
let gpT=0,lastB=0;
(function poll(){const p=(navigator.getGamepads?navigator.getGamepads():[])[0]||[];
 if(p.buttons&&!player.classList.contains('on')&&!$('set').classList.contains('on')){const now=performance.now(),x=p.axes[0]||0;
  if(now-gpT>220&&(x>.6||p.buttons[15]?.pressed)){move(1);gpT=now}else if(now-gpT>220&&(x<-.6||p.buttons[14]?.pressed)){move(-1);gpT=now}
  const a=p.buttons[0]?.pressed;if(a&&!lastB)play();lastB=a}
 requestAnimationFrame(poll)})();
addEventListener('pointerdown',()=>{if(ST.cfg.mus&&!mt)music()},{once:true});
/* boot */
texts();render();
(function boot(){const imgs=G.filter(g=>g.img).map(g=>g.img),tot=imgs.length+1;let n=0;const tips=T[ST.cfg.lang].tips;$('bt').textContent=tips[Math.floor(Math.random()*tips.length)];
 const bump=()=>{n++;$('bf').style.width=Math.min(100,n/tot*100)+'%'};imgs.forEach(s=>{const i=new Image();i.onload=i.onerror=bump;i.src=s});setTimeout(bump,1200);
 const w=setInterval(()=>{if(n>=tot){clearInterval(w);setTimeout(()=>{$('boot').classList.add('off');route()},250)}},100)})();
})();
</script>
</body>
</html>
