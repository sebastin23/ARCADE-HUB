<!DOCTYPE html>
<html lang="es"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelotation — Sandbox</title>
<style>
:root{--bg:rgba(255,255,255,.78);--fg:#14202b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(15,20,28,.78);--fg:#eef3f8}}
:root[data-theme="dark"]{--bg:rgba(15,20,28,.78);--fg:#eef3f8}
html,body{margin:0;height:100%;overflow:hidden;background:#87b5e0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;max-width:260px}
#hud b{font-size:18px}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;mix-blend-mode:difference;pointer-events:none}
#msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(10,15,25,.85);color:#fff;padding:18px 26px;border-radius:12px;font-size:20px;text-align:center;display:none;pointer-events:none}
#bar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:stretch;max-width:98vw;overflow-x:auto;padding:6px;background:var(--bg);border-radius:12px;z-index:5;-webkit-overflow-scrolling:touch}
#bar button{flex:0 0 auto;min-width:64px;font:700 20px system-ui,sans-serif;padding:6px 8px;border:2px solid transparent;border-radius:9px;background:rgba(120,140,170,.25);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#bar button small{font:600 10px system-ui,sans-serif;white-space:nowrap}
#bar button.on{border-color:#ffb347;background:rgba(255,179,71,.3)}
#bar .sep{flex:0 0 2px;background:rgba(120,140,170,.4);margin:2px 2px}
@media (max-width:700px){#hud{font-size:11px;max-width:190px;padding:6px 8px}#hud b{font-size:14px}}
</style></head><body>
<canvas id="c"></canvas><div id="cross"></div><div id="msg"></div>
<div id="hud"><b id="score">0</b><br><b style="font-size:15px">SANDBOX</b> · sin objetivos<br>WASD mover (Shift correr) · ratón mirar (clic para capturar)<br>Clic / Espacio: usar la herramienta · 1-5 herramientas<br>Flechas: mirar · Esc: soltar el ratón<br>Móvil: izq. mover, der. mirar / tocar para usar</div>
<div id="bar"></div>
<script src="registro-errores.js"></script>
<script src="asistente.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b5e0);scene.fog=new THREE.Fog(0x87b5e0,30,110);
const camera=new THREE.PerspectiveCamera(70,1,.1,200);camera.rotation.order='YXZ';

// Luces
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x4a5a30,.7));
const sun=new THREE.DirectionalLight(0xfff1d6,1.4);
sun.position.set(25,40,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:120});
sun.shadow.bias=-.0005;scene.add(sun);

// Texturas procedurales
function tex(size,fn,rx,ry,srgb){
  const c=document.createElement('canvas');c.width=c.height=size;fn(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;
  if(srgb)t.encoding=THREE.sRGBEncoding;return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const woodTex=tex(512,(g,s)=>{
  g.fillStyle='#9a6a35';g.fillRect(0,0,s,s);
  for(let i=0;i<260;i++){
    g.strokeStyle=`rgba(${rnd(50,90)|0},${rnd(25,50)|0},10,${rnd(.1,.4)})`;g.lineWidth=rnd(.6,2.5);
    g.beginPath();const y=rnd(0,s),a=rnd(2,8),f=rnd(.005,.02);
    for(let x=0;x<=s;x+=8)g.lineTo(x,y+Math.sin(x*f+i)*a);g.stroke();
  }
  g.strokeStyle='#4a2c12';g.lineWidth=28;g.strokeRect(0,0,s,s);
  g.lineWidth=18;g.beginPath();g.moveTo(14,14);g.lineTo(s-14,s-14);g.moveTo(s-14,14);g.lineTo(14,s-14);g.stroke();
},1,1,true);
const grassTex=tex(512,(g,s)=>{
  g.fillStyle='#3f6b2a';g.fillRect(0,0,s,s);
  for(let i=0;i<14000;i++){g.fillStyle=`rgb(${rnd(40,90)|0},${rnd(95,150)|0},${rnd(30,60)|0})`;g.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(2,6));}
},60,60,true);
const ballTex=tex(256,(g,s)=>{
  g.fillStyle='#d8392b';g.fillRect(0,0,s,s);g.fillStyle='#f2f2f2';
  for(let i=0;i<8;i+=2)g.fillRect(i*s/8,0,s/8,s);
},1,1,true);

// Física
const world=new CANNON.World();world.gravity.set(0,-9.82,0);
world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;world.solver.iterations=14;
const mCrate=new CANNON.Material('crate'),mBall=new CANNON.Material('ball'),mGround=new CANNON.Material('ground');
world.addContactMaterial(new CANNON.ContactMaterial(mCrate,mGround,{friction:.6,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(mCrate,mCrate,{friction:.5,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mCrate,{friction:.3,restitution:.35}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mGround,{friction:.4,restitution:.5}));
const gBody=new CANNON.Body({mass:0,material:mGround,shape:new CANNON.Plane()});
gBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);world.addBody(gBody);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({map:grassTex,roughness:1,bumpMap:grassTex,bumpScale:.6}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Cajas y bolas
const boxGeo=new THREE.BoxGeometry(1,1,1);
const boxMat=new THREE.MeshStandardMaterial({map:woodTex,bumpMap:woodTex,bumpScale:.8,roughness:.85});
const ballGeo=new THREE.SphereGeometry(.3,32,24);
const ballMat=new THREE.MeshStandardMaterial({map:ballTex,roughness:.35,metalness:.25});
// ===== SANDBOX: sin objetivos, sin munición, sin niveles =====
let crates=[],balls=[],fx=[];
const MAX_CRATES=Infinity,MAX_BALLS=250;   // cajas sin límite
let tool='ball',gMode=0,tMode=0;
const GRAV=[9.82,1.6,0],GNAME=['Normal','Luna','Sin gravedad'],TSCALE=[1,.3,.1],TNAME=['1x','Lenta 0.3x','Muy lenta 0.1x'];
const TOOLS=[['ball','🔴','Bola'],['heavy','⚫','Bola pesada'],['crate','📦','Poner caja'],['boom','💥','Explosión'],['del','🗑️','Borrar']];
const touchMove={f:0,s:0};

function removeCrate(o){scene.remove(o.mesh);world.removeBody(o.body);crates.splice(crates.indexOf(o),1)}
function removeBall(o){scene.remove(o.mesh);world.removeBody(o.body);balls.splice(balls.indexOf(o),1)}
function addCrate(x,y,z,ry){
  if(crates.length>=MAX_CRATES)removeCrate(crates[0]);
  const mesh=new THREE.Mesh(boxGeo,boxMat);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);
  const body=new CANNON.Body({mass:1,material:mCrate,shape:new CANNON.Box(new CANNON.Vec3(.5,.5,.5)),
    sleepSpeedLimit:.2,sleepTimeLimit:.6,linearDamping:.05,angularDamping:.1});
  body.position.set(x,y,z);if(ry)body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),ry);world.addBody(body);
  const o={mesh,body};crates.push(o);return o;
}
function addBall(p,dir,heavy,speed){
  if(balls.length>=MAX_BALLS)removeBall(balls[0]);
  const r=heavy?.5:.3,mesh=new THREE.Mesh(ballGeo,heavy?heavyMat:ballMat);mesh.scale.setScalar(r/.3);mesh.castShadow=true;scene.add(mesh);
  const body=new CANNON.Body({mass:heavy?30:4,material:mBall,shape:new CANNON.Sphere(r),linearDamping:.01});
  body.position.set(p.x,p.y,p.z);body.velocity.set(dir.x*speed,dir.y*speed,dir.z*speed);world.addBody(body);
  balls.push({mesh,body});
}
const heavyMat=new THREE.MeshStandardMaterial({color:0x222831,roughness:.3,metalness:.7});
function wall(x,z,w,h){for(let r=0;r<h;r++)for(let c=0;c<w;c++)addCrate(x+(c-w/2)*1.02+(r%2?.5:0),.5+r*1.001,z)}
function pyramid(x,z,n){for(let r=0;r<n;r++)for(let c=0;c<n-r;c++)addCrate(x+(c-(n-r)/2)*1.02,.5+r*1.001,z)}
function tower(x,z,h){for(let r=0;r<h;r++)addCrate(x,.5+r*1.001,z)}
function dominoes(x,z,n){for(let i=0;i<n;i++)addCrate(x+(i-n/2)*1.35,.5,z)}
// sitio delante del jugador donde aparecen las estructuras
function front(d){return{x:pos.x-Math.sin(yaw)*d,z:pos.z-Math.cos(yaw)*d}}
const STRUCT={
  wall:()=>{const p=front(10);wall(p.x,p.z,8,5)},
  pyr:()=>{const p=front(11);pyramid(p.x,p.z,7)},
  tower:()=>{const p=front(9);tower(p.x,p.z,10)},
  domino:()=>{const p=front(10);dominoes(p.x,p.z,12)},
  mix:()=>{const p=front(14);wall(p.x-9,p.z,5,4);pyramid(p.x+9,p.z,5);tower(p.x,p.z,7)}
};
function clearAll(){[...crates].forEach(removeCrate);[...balls].forEach(removeBall)}

// punto al que apunta la mira
const ray=new THREE.Raycaster();
function aim(){
  ray.setFromCamera({x:0,y:0},camera);ray.far=80;
  const hits=ray.intersectObjects([ground,...crates.map(o=>o.mesh),...balls.map(o=>o.mesh)],false);
  if(!hits.length)return null;const h=hits[0];
  const n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):new THREE.Vector3(0,1,0);
  return{p:h.point,n,obj:h.object};
}
function boom(p){
  const R=8,F=70;
  for(const o of [...crates,...balls]){
    const q=o.body.position,dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d<R){const k=F*(1-d/R)/Math.max(d,.5)*o.body.mass*.5;o.body.wakeUp();o.body.applyImpulse(new CANNON.Vec3(dx*k,(dy+1.5)*k,dz*k),o.body.position)}
  }
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:.7}));
  m.position.copy(p);scene.add(m);fx.push({m,t:0});
}
function act(){
  if(tool==='ball'||tool==='heavy'){
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    addBall(camera.position.clone().addScaledVector(dir,1),dir,tool==='heavy',tool==='heavy'?26:30);return;
  }
  const a=aim();if(!a)return;
  if(tool==='crate'){const q=a.p.clone().addScaledVector(a.n,.51);addCrate(q.x,Math.max(.5,q.y),q.z,yaw)}
  else if(tool==='boom')boom(a.p);
  else if(tool==='del'){
    const c=crates.find(o=>o.mesh===a.obj);if(c)return removeCrate(c);
    const b=balls.find(o=>o.mesh===a.obj);if(b)removeBall(b);
  }
}

// ---- interfaz ----
const bar=document.getElementById('bar');
function buildBar(){
  const b=(id,t,on)=>`<button id="${id}"${on?' class="on"':''}>${t}</button>`;
  bar.innerHTML=TOOLS.map((t,i)=>b('t_'+t[0],`${t[1]}<small>${i+1} · ${t[2]}</small>`,tool===t[0])).join('')+'<span class="sep"></span>'+
   b('s_wall','🧱<small>M · Muro</small>')+b('s_pyr','🔺<small>P · Pirámide</small>')+b('s_tower','🗼<small>U · Torre</small>')+b('s_domino','🁢<small>O · Dominó</small>')+b('s_mix','🏗️<small>I · Mezcla</small>')+'<span class="sep"></span>'+
   b('gmode',`🌙<small>G · Gravedad: ${GNAME[gMode]}</small>`)+b('tmode',`⏱️<small>T · Tiempo: ${TNAME[tMode]}</small>`)+b('clr','🧹<small>R · Limpiar</small>');
  TOOLS.forEach(t=>document.getElementById('t_'+t[0]).onclick=()=>setTool(t[0]));
  for(const k in STRUCT)document.getElementById('s_'+k).onclick=STRUCT[k];
  document.getElementById('gmode').onclick=cycleG;document.getElementById('tmode').onclick=cycleT;document.getElementById('clr').onclick=clearAll;
}
function setTool(t){tool=t;buildBar();toast(TOOLS.find(x=>x[0]===t)[2])}
function cycleG(){gMode=(gMode+1)%GRAV.length;world.gravity.set(0,-GRAV[gMode],0);for(const o of [...crates,...balls])o.body.wakeUp();buildBar();toast('Gravedad: '+GNAME[gMode])}
function cycleT(){tMode=(tMode+1)%TSCALE.length;buildBar();toast('Tiempo: '+TNAME[tMode])}
let toastT=0;function toast(h){const m=document.getElementById('msg');m.innerHTML=h;m.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>m.style.display='none',1100)}
buildBar();

// ---- controles ----
let yaw=0,pitch=-.05;const pos=new THREE.Vector3(0,1.7,12);const keys={};
const KEYTOOL={Digit1:'ball',Digit2:'heavy',Digit3:'crate',Digit4:'boom',Digit5:'del'};
const KEYSTRUCT={KeyM:'wall',KeyP:'pyr',KeyU:'tower',KeyO:'domino',KeyI:'mix'};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='Space'){act();e.preventDefault()}
  else if(KEYTOOL[e.code])setTool(KEYTOOL[e.code]);
  else if(KEYSTRUCT[e.code])STRUCT[KEYSTRUCT[e.code]]();
  else if(e.code==='KeyG')cycleG();else if(e.code==='KeyT')cycleT();else if(e.code==='KeyR')clearAll()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touchMove.f=touchMove.s=0});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas||e.buttons===2){yaw-=e.movementX*.0025;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0025))}
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(document.pointerLockElement!==canvas){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}}
  act();
});
const clampP=v=>Math.max(-1.4,Math.min(1.4,v));let tl=null,tr=null;
const onBar=e=>e.target&&e.target.closest&&e.target.closest('#bar');
addEventListener('touchstart',e=>{if(onBar(e))return;for(const t of e.changedTouches){const o={id:t.identifier,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,moved:0};if(t.clientX<innerWidth/2)tl=o;else tr=o}},{passive:false});
addEventListener('touchmove',e=>{if(onBar(e))return;e.preventDefault();for(const t of e.changedTouches){
  if(tl&&t.identifier===tl.id){touchMove.f=Math.max(-1,Math.min(1,(tl.y-t.clientY)/50));touchMove.s=Math.max(-1,Math.min(1,(t.clientX-tl.x)/50))}
  else if(tr&&t.identifier===tr.id){yaw-=(t.clientX-tr.lx)*.005;pitch=clampP(pitch-(t.clientY-tr.ly)*.005);tr.moved+=Math.abs(t.clientX-tr.lx)+Math.abs(t.clientY-tr.ly);tr.lx=t.clientX;tr.ly=t.clientY}}},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches){
  if(tl&&t.identifier===tl.id){tl=null;touchMove.f=touchMove.s=0}
  else if(tr&&t.identifier===tr.id){if(tr.moved<12)act();tr=null}}});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---- bucle ----
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;
  if(keys.ArrowUp)pitch=Math.min(1.4,pitch+dt*1.5);if(keys.ArrowDown)pitch=Math.max(-1.4,pitch-dt*1.5);
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)+touchMove.f,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchMove.s,v=(keys.ShiftLeft?10:6)*dt;
  pos.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v;pos.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v;
  pos.x=Math.max(-45,Math.min(45,pos.x));pos.z=Math.max(-45,Math.min(45,pos.z));
  for(const o of crates){const q=o.body.position;if(q.y>2.2)continue;const dx=pos.x-q.x,dz=pos.z-q.z,r=.85;
    if(Math.abs(dx)<r&&Math.abs(dz)<r){if(Math.abs(dx)>Math.abs(dz))pos.x=q.x+(dx<0?-r:r);else pos.z=q.z+(dz<0?-r:r)}}
  camera.position.copy(pos);camera.rotation.set(pitch,yaw,0);

  world.step(1/60,dt*TSCALE[tMode],4);
  for(const o of crates){
    if(o.body.position.y<-20){removeCrate(o);continue}   // cayó fuera del mundo
    o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);
  }
  for(const o of [...balls]){
    if(o.body.position.y<-20||o.body.position.y>200){removeBall(o);continue}
    o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);
  }
  for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t+=dt;const k=e.t/.45;e.m.scale.setScalar(1+k*7);e.m.material.opacity=Math.max(0,.7*(1-k));if(k>=1){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();fx.splice(i,1)}}
  document.getElementById('score').textContent='📦 '+crates.length+' · 🔴 '+balls.length;
  renderer.render(scene,camera);
}
loop();
</script><script src="mejoras.js"></script>
</body></html>
