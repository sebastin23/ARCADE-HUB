#js{position:absolute;left:3%;bottom:0;width:32%;height:100%;pointer-events:auto}

@media(pointer:coarse){#tc{display:block}}
button{transition:transform .12s,background .2s,border-color .2s}button:hover{transform:translateY(-2px) scale(1.04);border-color:var(--ac)}button:active{transform:scale(.96)}
.bg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff8;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;flex:none}
.vs{display:flex;align-items:center;gap:12px;margin:6px 0;padding:10px 22px;border-radius:16px;background:linear-gradient(90deg,#1c3b26,#142a1c);animation:gl 2.5s infinite alternate}
.vs b{display:block;font-size:22px}.vs small{display:block;opacity:.8;font-size:12px}.vs em{font-style:normal;font-weight:900;color:var(--ac);font-size:26px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:760px;width:100%}
.tm{flex-direction:column;gap:2px;padding:12px 6px 8px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,#1a3a25,#10241a)}
.tm b{font-size:14px}.tm small{font-size:10px;opacity:.7;font-weight:600}
.tm::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--a) 50%,var(--b) 50%)}
.tm.on{background:linear-gradient(160deg,#ffd23f,#f2a900);color:#10200f;box-shadow:0 0 22px #ffd23f88;transform:scale(1.05);animation:pop .25s}

.seg{padding:8px 18px;border-radius:999px}.vs{cursor:pointer}.vs:hover{transform:scale(1.03)}
#bsub{position:absolute;top:8px;right:10px;font-size:13px;z-index:2}
.cd{display:inline-block;width:.55em;height:.8em;border-radius:3px;vertical-align:middle;margin-right:.2em;box-shadow:0 2px 8px #0008}.cd.y{background:#ffd23f}.cd.r{background:#e8453c}

const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x1f5a2c,metalness:0}));gr.rotation.x=-Math.PI/2;gr.position.y=-.03;gr.receiveShadow=true;sc.add(gr);
const STAD=['San Mamés','Bernabéu','Camp Nou','Sánchez-Pizjuán','San Siro','Emirates','Allianz Arena','Parc des Princes'];
const STC=[[0x8fb8e0,0],[0x7fa8d8,1],[0x9cc7ee,0],[0xf2c48c,0],[0x7d8db0,1],[0xa9bfd6,0],[0x8aa6c8,1],[0x6f86b8,0]];
const stands=new THREE.Group();sc.add(stands);const adMat=new THREE.MeshBasicMaterial({color:0xffffff}),roofM=new THREE.MeshLambertMaterial({color:0x3a3d46});

function adTex(name){return tex(2048,64,(q,w,h)=>{const n=[name.toUpperCase(),'FOOTBALL LEGENDS','ARCADE HUB','SUPER PIZZA','NEÓN BUGGY','EKOVOZIA','CAFÉ ONDA'],cl=['#c0392b','#1d3f9f','#f29400','#127a3a','#6a2c91','#0e7c86','#222'];q.font='800 34px system-ui,sans-serif';q.textAlign='center';q.textBaseline='middle';for(let i=0;i<7;i++){q.fillStyle=cl[i];q.fillRect(i*w/7,0,w/7,h);q.fillStyle='#fff';q.fillText(n[i],(i+.5)*w/7,h/2+2)}})}

if(roof){const r=new THREE.Mesh(new THREE.BoxGeometry(L,.6,9),roofM);r.position.set(0,13,9);g.add(r)}return g}
function setStadium(){stands.clear();const [sky,roof]=STC[sel.me],hm=TM[sel.me],aw=TM[sel.op],mat=(c,L)=>new THREE.MeshBasicMaterial({map:crowdTex(c[1],c[2],L)});
sc.background.set(sky);sc.fog.color.set(sky);adMat.map=adTex(STAD[sel.me]);adMat.needsUpdate=true;
for(const sg of[-1,1]){let g=stand(134,mat(hm,134),roof);g.position.z=sg*(HW+5);g.rotation.y=sg>0?0:Math.PI;stands.add(g);
g=stand(74,mat(sg>0?aw:hm,74),roof);g.position.x=sg*(HL+6);g.rotation.y=sg>0?Math.PI/2:-Math.PI/2;stands.add(g);

m=new THREE.Mesh(new THREE.BoxGeometry(.25,1.2,72),adMat);m.position.set(sg*(HL+4.5),.6,0);stands.add(m);
for(const sz of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,32,8),new THREE.MeshLambertMaterial({color:0x888c94}));p.position.set(sg*(HL+16),16,sz*(HW+20));stands.add(p);const l=new THREE.Mesh(new THREE.BoxGeometry(7,3.5,1),new THREE.MeshBasicMaterial({color:0xfffbe0,fog:false}));l.position.set(sg*(HL+16),33,sz*(HW+20));l.lookAt(0,10,0);stands.add(l)}}
const nm=new THREE.Mesh(new THREE.PlaneGeometry(44,4),new THREE.MeshBasicMaterial({map:tex(1024,94,(q,w,h)=>{q.fillStyle='#0d1b12';q.fillRect(0,0,w,h);q.fillStyle=hm[1];q.fillRect(0,0,w,10);q.fillStyle='#fff';q.font='900 62px system-ui';q.textAlign='center';q.textBaseline='middle';q.fillText(STAD[sel.me].toUpperCase(),w/2,h/2+4)})}));nm.position.set(0,10.5,-(HW+5)-12.3);stands.add(nm)}
const wm=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0});
for(const s of[-1,1]){const g=new THREE.Group();g.position.x=s*HL;
for(const z of[-GW,GW]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.44,10),wm);p.position.set(0,1.22,z);p.castShadow=true;g.add(p)}

const nt=new THREE.Mesh(new THREE.BoxGeometry(GDP,2.44,GW*2,4,4,14),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35}));nt.position.set(s*GDP/2,1.22,0);g.add(nt);sc.add(g)}
/* balón */
const b={x:0,z:0,vx:0,vz:0,r:.45};
const bTex=tex(256,128,(q,w,h)=>{q.fillStyle='#f4f4f4';q.fillRect(0,0,w,h);q.fillStyle='#1b1b1b';for(let i=0;i<14;i++){const x=(i%7)*w/7+(i>6?w/14:0)+10,y=i>6?h*.7:h*.3;q.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;q.lineTo(x+Math.cos(a)*13,y+Math.sin(a)*13)}q.fill()}});
const bm=new THREE.Mesh(new THREE.SphereGeometry(b.r,20,14),new THREE.MeshStandardMaterial({map:bTex,roughness:.5,metalness:0}));bm.castShadow=true;sc.add(bm);

/* confeti */
const NC=300,cp=new Float32Array(NC*3),cv=new Float32Array(NC*3).fill(0),cc=new Float32Array(NC*3);cp.fill(-100);

function mkMesh(c1,c2,sk){const g=new THREE.Group(),M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:0});

Object.assign(b,{x:0,z:0,vx:0,vz:0});owner=null;freeze=1.5;kreq=qreq=treq=0}
/* ---- física ---- */
function move(p,dx,dz,sp,dt,vw,vs){let l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l;l=1}
const run=sp&&p.stam>.04&&l>.2;if(run)p.stam-=dt*.2;else p.stam=Math.min(1,p.stam+dt*(l>.2?.08:.2));
let ms=(run?vs:vw)*(p.fit||1);if(p.stun>0){p.stun-=dt;ms*=.25}
let tx=dx*ms,tz=dz*ms,k=6;
if(p.lunge>0){p.lunge-=dt;tx=p.fx*11;tz=p.fz*11;k=14}

k=Math.min(1,k*dt);p.vx+=(tx-p.vx)*k;p.vz+=(tz-p.vz)*k;p.x+=p.vx*dt;p.z+=p.vz*dt;p.anim+=Math.hypot(p.vx,p.vz)*dt*1.6;

function bs(){if(clock-lastB>.1){snd.bounce();lastB=clock}}
function hit(p){const dx=b.x-p.x,dz=b.z-p.z,d=Math.hypot(dx,dz),m=p.r+b.r;

function pen(d){if(pbusy)return;pbusy=1;const k=pn.k,t=k[0].length==k[1].length?0:1,dir=Math.floor(Math.random()*3),goal=dir!=d&&Math.random()>(t?.12:.08);k[t].push(goal);if(goal)snd.goal();
penUI(goal?(t?'¡Gol del rival!':'¡GOL!'):(t?'¡Parada!':'¡Parada del portero!'));
setTimeout(()=>{pbusy=0;const a=k[0],c=k[1],g0=a.filter(x=>x).length,g1=c.filter(x=>x).length;let w=-1;
if(a.length==c.length&&a.length>=5&&g0!=g1)w=g0>g1?0:1;else if(a.length<=5&&c.length<=5){if(g0>g1+(5-c.length))w=0;else if(g1>g0+(5-a.length))w=1}
if(w>=0){pnW=w;pnS=g0+'–'+g1;finish()}else penUI(a.length==c.length?'Tu turno':'Chuta el rival…')},1400)}
$('ov').onclick=e=>{const x=e.target.closest('[data-k]');if(!x)return;const k=x.dataset.k,v=x.dataset.i;sel[k]=(k=='fm'||k=='df')?v:+v;if(sel.me==sel.op)sel.op=(sel.me+1)%8;menu()};
$('ov').onclick=e=>{const pk=e.target.closest('[data-pk]');if(pk){pen(+pk.dataset.pk);return}
const sa=e.target.closest('[data-sa]'),sb=e.target.closest('[data-sb]');
if(sa){selS=+sa.dataset.sa;subsUI();return}
if(sb){if(selS!=null&&nsub<5){const p=P.find(q=>q.team==0&&q.n==selS),c=bench.find(q=>q.n==+sb.dataset.sb);if(p&&c){[p.n,c.n]=[c.n,p.n];[p.fit,c.fit]=[c.fit,p.fit];p.stam=1;p.yc=0;nsub++}}selS=null;subsUI();return}
const x=e.target.closest('[data-k]');if(!x)return;au();tone(650,.05,'square',.05);const k=x.dataset.k,v=x.dataset.i;
if(k=='swap')[sel.me,sel.op]=[sel.op,sel.me];else if(k=='rnd')sel.op=Math.floor(Math.random()*8);else sel[k]=(k=='fm'||k=='df')?v:+v;
if(sel.me==sel.op)sel.op=(sel.me+1)%8;menu()};

au();build();score=[0,0];el=0;PH=1;pnW=-1;nsub=0;selS=null;bench=[12,13,14,15,16].map(n=>({n,fit:1}));ctrl=null;CN=[[0,0],[0,0]];SP=null;place();ST='play';$('ov').className='h';ban('🏟 '+STAD[sel.me]+'<small>'+TM[sel.me][0]+' vs '+TM[sel.op][0]+'</small>',2400)};

addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=1;if(e.code=='Space')kreq=.18;if(e.code=='KeyQ')qreq=.18;if(e.code=='KeyE')treq=.18;if(e.code=='KeyC')openSubs()});
addEventListener('keyup',e=>keys[e.code]=0);addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
let j0=null;const js=$('js');
js.onpointerdown=e=>{js.setPointerCapture(e.pointerId);j0={x:e.clientX,y:e.clientY}};
js.onpointermove=e=>{if(j0){tv.x=Math.max(-1,Math.min(1,(e.clientX-j0.x)/45));tv.z=Math.max(-1,Math.min(1,(e.clientY-j0.y)/45))}};

$('bS').onpointerdown=()=>tb.s=1;$('bS').onpointerup=$('bS').onpointerleave=()=>tb.s=0;
$('bK').onpointerdown=()=>kreq=.18;$('bsub').onclick=openSubs;$('bP').onpointerdown=()=>qreq=.18;$('bT').onpointerdown=()=>treq=.18;
build();ctrl=P[5];place();freeze=0;ring.visible=false;menu();showRec();requestAnimationFrame(loop);
