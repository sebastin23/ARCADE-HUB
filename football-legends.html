<script>
const $=id=>document.getElementById(id);
const TM=[['Bilbao','#d8202a','#f4f4f4'],['Madrid','#f2f2f2','#1b3a8a'],['Barcelona','#1d3f9f','#a0183c'],['Sevilla','#f4f4f4','#d8202a'],['Milán','#f29400','#161616'],['Londres','#d92b2b','#f4f4f4'],['Múnich','#c4122e','#f4f4f4'],['París','#12245e','#d4af37']];

const ERR={easy:.5,normal:.25,hard:.1},SPD={easy:.88,normal:1,hard:1.1},TKL={easy:.6,normal:1.4,hard:2.6};
const HL=50,HW=32,GW=3.66,GDP=2.5,MATCH=180;
let ST='menu',sel={me:0,op:1,fm:'4-4-2',df:'normal'},score=[0,0],tLeft=MATCH,freeze=0,gt=0,ctrl=null,kreq=0,qreq=0,treq=0,clock=0,lastB=0,lastHud='',P=[],RK=[[],[]],cx=0;
const keys={},tv={x:0,z:0},tb={s:0};let owner=null;
/* ---- sonido ---- */
let AC;function au(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,d,ty='sine',v=.15,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(t+d)}
const snd={kick:()=>tone(170,.13,'triangle',.3,50),bounce:()=>tone(240,.06,'sine',.07,130),post:()=>tone(900,.25,'triangle',.2,650),tackle:()=>tone(100,.2,'sawtooth',.1,40),whistle:()=>{tone(2200,.45,'sine',.1);tone(2320,.45,'sine',.1)},goal:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.4,'square',.07),i*110))};
const getRec=()=>{try{return JSON.parse(localStorage.getItem('fl3d'))||{w:0,p:0,best:0}}catch(e){return{w:0,p:0,best:0}}};
const setRec=r=>{try{localStorage.setItem('fl3d',JSON.stringify(r))}catch(e){}};
/* ---- escena ---- */
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(2,devicePixelRatio));rd.shadowMap.enabled=true;$('w').appendChild(rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9cc7ee);sc.fog=new THREE.Fog(0x9cc7ee,90,200);
const cam=new THREE.PerspectiveCamera(48,1,.5,400);
function rs(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
sc.add(new THREE.HemisphereLight(0xffffff,0x8a9a8a,1));
const sun=new THREE.DirectionalLight(0xffffff,1.05);sun.position.set(25,60,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-62,right:62,top:42,bottom:-42,near:10,far:140});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0005;sc.add(sun);
const tex=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t};
const pitchTex=tex(1024,656,(q,w,h)=>{const u=w/100,cx=w/2,cy=h/2;
for(let i=0;i<14;i++){q.fillStyle=i%2?'#2f8f3f':'#3a9d4a';q.fillRect(i*w/14,0,w/14+1,h)}
for(let i=0;i<9000;i++){q.fillStyle=Math.random()<.5?'rgba(0,0,0,.05)':'rgba(255,255,255,.05)';q.fillRect(Math.random()*w,Math.random()*h,2,4)}
q.strokeStyle='#fff';q.fillStyle='#fff';q.lineWidth=3;q.strokeRect(3,3,w-6,h-6);q.beginPath();q.moveTo(cx,0);q.lineTo(cx,h);q.stroke();
q.beginPath();q.arc(cx,cy,9.15*u,0,7);q.stroke();q.beginPath();q.arc(cx,cy,4,0,7);q.fill();
for(const s of[0,1]){const x0=s?w:0,d=s?-1:1;q.strokeRect(s?w-16.5*u:0,cy-20*u,16.5*u,40*u);q.strokeRect(s?w-5.5*u:0,cy-9*u,5.5*u,18*u);
q.beginPath();q.arc(x0+d*11*u,cy,4,0,7);q.fill();q.beginPath();q.arc(x0+d*11*u,cy,9.15*u,s?Math.PI-.93:-.93,s?Math.PI+.93:.93);q.stroke()}});
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(100,64),new THREE.MeshStandardMaterial({map:pitchTex,roughness:1,metalness:0}));pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;sc.add(pitch);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x1f5a2c,metalness:0}));gr.rotation.x=-Math.PI/2;gr.position.y=-.03;gr.receiveShadow=true;sc.add(gr);
const crowd=tex(256,64,(q,w,h)=>{q.fillStyle='#222';q.fillRect(0,0,w,h);for(let i=0;i<1800;i++){q.fillStyle=`hsl(${Math.random()*360},60%,${35+Math.random()*30}%)`;q.fillRect(Math.random()*w,Math.random()*h,3,4)}});
for(const[x,z,w,d,ry] of[[0,HW+9,130,10,0],[0,-HW-9,130,10,0],[HL+10,0,10,80,0],[-HL-10,0,10,80,0]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,9,d),new THREE.MeshBasicMaterial({map:crowd}));m.position.set(x,4.5,z);sc.add(m)}
const wm=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0});
for(const s of[-1,1]){const g=new THREE.Group();g.position.x=s*HL;
for(const z of[-GW,GW]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.44,10),wm);p.position.set(0,1.22,z);p.castShadow=true;g.add(p)}
const cb=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,GW*2,10),wm);cb.rotation.x=Math.PI/2;cb.position.y=2.44;g.add(cb);
const nt=new THREE.Mesh(new THREE.BoxGeometry(GDP,2.44,GW*2,4,4,14),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35}));nt.position.set(s*GDP/2,1.22,0);g.add(nt);sc.add(g)}
/* balón */
const b={x:0,z:0,vx:0,vz:0,r:.45};
const bTex=tex(256,128,(q,w,h)=>{q.fillStyle='#f4f4f4';q.fillRect(0,0,w,h);q.fillStyle='#1b1b1b';for(let i=0;i<14;i++){const x=(i%7)*w/7+(i>6?w/14:0)+10,y=i>6?h*.7:h*.3;q.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;q.lineTo(x+Math.cos(a)*13,y+Math.sin(a)*13)}q.fill()}});
const bm=new THREE.Mesh(new THREE.SphereGeometry(b.r,20,14),new THREE.MeshStandardMaterial({map:bTex,roughness:.5,metalness:0}));bm.castShadow=true;sc.add(bm);
const ring=new THREE.Mesh(new THREE.RingGeometry(1,1.3,28),new THREE.MeshBasicMaterial({color:0xffd23f,side:2}));ring.rotation.x=-Math.PI/2;ring.position.y=.06;sc.add(ring);
/* confeti */
const NC=300,cp=new Float32Array(NC*3),cv=new Float32Array(NC*3).fill(0),cc=new Float32Array(NC*3);cp.fill(-100);
const cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.BufferAttribute(cp,3));cg.setAttribute('color',new THREE.BufferAttribute(cc,3));
const confP=new THREE.Points(cg,new THREE.PointsMaterial({size:.7,vertexColors:true}));confP.frustumCulled=false;sc.add(confP);
function burst(x){const cl=['#ffd23f','#ff4d6d','#4dd2ff','#7CFC00','#fff'];for(let i=0;i<NC;i++){cp.set([x,3,(Math.random()-.5)*8],i*3);cv.set([-Math.sign(x)*Math.random()*14,6+Math.random()*12,(Math.random()-.5)*16],i*3);const c=new THREE.Color(cl[i%5]);cc.set([c.r,c.g,c.b],i*3)}cg.attributes.color.needsUpdate=true}
/* jugadores */
function mkMesh(c1,c2,sk){const g=new THREE.Group(),M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:0});
const add=(geo,m,x,y,z,p=g)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;p.add(o)};
const sh=M(c1);add(new THREE.BoxGeometry(.65,.75,.38),sh,0,1.35,0);add(new THREE.SphereGeometry(.23,12,10),M(sk),0,1.95,0);add(new THREE.BoxGeometry(.67,.3,.4),M(c2),0,.92,0);
g.legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.17,.85,0);g.add(p);add(new THREE.BoxGeometry(.24,.8,.26),M(c1),0,-.4,0,p);return p});
g.arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.42,1.65,0);g.add(p);add(new THREE.BoxGeometry(.18,.65,.2),sh,0,-.3,0,p);return p});
g.rotation.order='YXZ';g.scale.setScalar(1.25);return g}
function build(){for(const p of P)sc.remove(p.mesh);P=[];const rf=Object.keys(FM)[Math.floor(Math.random()*3)];
for(const t of[0,1]){const tm=TM[t?sel.op:sel.me],dir=t?-1:1,f=t?FM[rf]:FM[sel.fm];
for(let i=0;i<11;i++){const gk=i==0,[d,l]=gk?[.02,0]:f[i-1];
const p={team:t,gk,hx:(-HL+d*2*HL)*dir,hz:l*26*dir,x:0,z:0,vx:0,vz:0,fx:dir,fz:0,r:.7,anim:0,stam:1,kcd:0,tcd:0,th:0,stun:0,lunge:0,hd:0,chase:false,n:i+1};
p.mesh=gk?mkMesh(t?'#f5a623':'#26c281','#222','#f1c9a5'):mkMesh(tm[1],tm[2],['#f6d3b6','#f1c9a5','#e9b996'][i%3]);sc.add(p.mesh);P.push(p)}}}
function place(){for(const p of P){const dir=p.team?-1:1;p.x=p.hx;if(p.x*dir>-3)p.x=-3*dir;p.z=p.hz;p.vx=p.vz=p.stun=p.lunge=0;p.fx=dir;p.fz=0;p.kcd=p.tcd=0}
Object.assign(b,{x:0,z:0,vx:0,vz:0});owner=null;freeze=1.5;kreq=qreq=treq=0}
/* ---- física ---- */
function move(p,dx,dz,sp,dt,vw,vs){let l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l;l=1}
const run=sp&&p.stam>.04&&l>.2;if(run)p.stam-=dt*.2;else p.stam=Math.min(1,p.stam+dt*(l>.2?.08:.2));
let ms=run?vs:vw;if(p.stun>0){p.stun-=dt;ms*=.25}
let tx=dx*ms,tz=dz*ms,k=6;
if(p.lunge>0){p.lunge-=dt;tx=p.fx*11;tz=p.fz*11;k=14}
else if(l>.2){const q=Math.min(1,12*dt);p.fx+=(dx/l-p.fx)*q;p.fz+=(dz/l-p.fz)*q;const f=Math.hypot(p.fx,p.fz)||1;p.fx/=f;p.fz/=f}
k=Math.min(1,k*dt);p.vx+=(tx-p.vx)*k;p.vz+=(tz-p.vz)*k;p.x+=p.vx*dt;p.z+=p.vz*dt;p.anim+=Math.hypot(p.vx,p.vz)*dt*1.6;
p.x=Math.max(-HL+.6,Math.min(HL-.6,p.x));p.z=Math.max(-HW+.6,Math.min(HW-.6,p.z))}
function bs(){if(clock-lastB>.1){snd.bounce();lastB=clock}}
function hit(p){const dx=b.x-p.x,dz=b.z-p.z,d=Math.hypot(dx,dz),m=p.r+b.r;
if(d<m&&d>0){const nx=dx/d,nz=dz/d;b.x=p.x+nx*m;b.z=p.z+nz*m;const rel=(b.vx-p.vx)*nx+(b.vz-p.vz)*nz;
if(rel<0){b.vx-=1.35*rel*nx;b.vz-=1.35*rel*nz;if(-rel>5)bs()}}}
function kick(p,dx,dz,pow){const l=Math.hypot(dx,dz)||1;b.vx=dx/l*pow+p.vx*.3;b.vz=dz/l*pow+p.vz*.3;p.kcd=.4;owner=null;snd.kick()}
function startTackle(p){if(p.tcd>0||p.stun>0||p.gk)return;p.lunge=.25;p.tcd=1.3;p.hd=0}
function tk(p){if(p.lunge<=0||p.hd)return;for(const o of P){if(o.team==p.team||Math.hypot(o.x-p.x,o.z-p.z)>p.r+o.r+.5)continue;
p.hd=1;o.stun=.9;o.vx+=p.fx*6;o.vz+=p.fz*6;if(owner===o||Math.hypot(b.x-o.x,b.z-o.z)<2.6){owner=null;o.kcd=.6;b.vx=p.fx*9;b.vz=p.fz*9}snd.tackle();return}}
function goal(s){score[s]++;owner=null;ST='goal';gt=3.2;burst(s?-HL:HL);snd.goal();const t=TM[s?sel.op:sel.me];$('bn').innerHTML='¡GOOOL!<small>'+t[0]+'</small>';$('bn').style.display='block'}
function ballStep(dt){b.x+=b.vx*dt;b.z+=b.vz*dt;const f=Math.max(0,1-.7*dt);b.vx*=f;b.vz*=f;
let s=Math.hypot(b.vx,b.vz);if(s>32){b.vx*=32/s;b.vz*=32/s;s=32}
if(b.z<-HW+b.r){b.z=-HW+b.r;b.vz=Math.abs(b.vz)*.75;bs()}if(b.z>HW-b.r){b.z=HW-b.r;b.vz=-Math.abs(b.vz)*.75;bs()}
for(const gx of[-HL,HL]){const o=gx<0?-1:1;
for(const pz of[-GW,GW]){const dx=b.x-gx,dz=b.z-pz,d=Math.hypot(dx,dz),m=b.r+.12;if(d<m&&d>0){const nx=dx/d,nz=dz/d;b.x=gx+nx*m;b.z=pz+nz*m;const v=b.vx*nx+b.vz*nz;if(v<0){b.vx-=1.8*v*nx;b.vz-=1.8*v*nz;snd.post()}}}
const bey=(b.x-gx)*o,inM=Math.abs(b.z)<GW;
if(bey>0&&inM){if(b.z<-GW+b.r){b.z=-GW+b.r;b.vz=Math.abs(b.vz)*.4}if(b.z>GW-b.r){b.z=GW-b.r;b.vz=-Math.abs(b.vz)*.4}
if(bey>GDP-b.r){b.x=gx+o*(GDP-b.r);b.vx*=-.2;b.vz*=.5}if(bey>b.r&&ST=='play')goal(o>0?0:1)}
else if(bey>-b.r&&!inM){b.x=gx-o*b.r;b.vx=-b.vx*.75;bs()}}}
/* ---- IA ---- */
const d2=p=>(p.x-b.x)**2+(p.z-b.z)**2;
function press(p){for(const o of P)if(o.team!=p.team&&Math.hypot(o.x-p.x,o.z-p.z)<4.5)return true;return false}
function pass(p,h){let best=null,bsc=-1e9;for(const q of P){if(q.team!=p.team||q===p||q.gk)continue;
const dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);if(d<4)continue;const dot=(dx*p.fx+dz*p.fz)/d;if(h&&dot<.4)continue;
let od=99;for(const o of P)if(o.team!=p.team)od=Math.min(od,Math.hypot(o.x-q.x,o.z-q.z));
const s=(h?dot*12:(q.x-p.x)*(p.team?-1:1)*.25)-d*.12+Math.min(od,8)*.8;if(s>bsc){bsc=s;best=q}}
if(best){const d=Math.hypot(best.x-p.x,best.z-p.z);kick(p,best.x+best.vx*.5-b.x,best.z+best.vz*.5-b.z,Math.min(20,8+d*.9))}else if(h)kick(p,p.fx,p.fz,16)}
function ai(p,dt){const t=p.team,dir=t?-1:1,bd=Math.hypot(b.x-p.x,b.z-p.z),df=sel.df,K=t?SPD[df]:1;let tx,tz,sp=0;
if(p.gk){tx=-dir*(HL-2.2);tz=Math.max(-GW+.6,Math.min(GW-.6,b.z*.4));
if(bd<10&&Math.abs(b.x-tx)<16){tx=b.x;tz=b.z;sp=1}if(bd<1.9&&p.kcd<=0)kick(p,dir*.9,(Math.random()-.5)*1.2,20)}
else if(p.chase){let ux=dir*HL-b.x,uz=-b.z;const ul=Math.hypot(ux,uz)||1;ux/=ul;uz/=ul;
const behind=(p.x-b.x)*ux+(p.z-b.z)*uz<.6;
if(p===owner||(bd<3&&behind)){tx=b.x+ux*3;tz=b.z+uz*3;sp=1;
if(p.th<=0&&p.kcd<=0&&bd<1.8){if(Math.abs(dir*HL-p.x)<27&&Math.random()<.6){const a=Math.atan2((Math.random()-.5)*2*GW*.85-b.z,dir*HL-b.x)+(Math.random()-.5)*(t?ERR[df]:.25);kick(p,Math.cos(a),Math.sin(a),22+Math.random()*5);p.th=1}
else if(press(p)){pass(p,0);p.th=.8}}}
else{const tt=Math.min(bd/10,.5),px=b.x+b.vx*tt,pz=b.z+b.vz*tt;
if(behind){tx=px-ux*1.2;tz=pz-uz*1.2}else{const s=Math.sign((p.x-b.x)*-uz+(p.z-b.z)*ux)||1;tx=px-ux*2.5-uz*3*s;tz=pz-uz*2.5+ux*3*s}sp=bd>8}
if(p.tcd<=0&&p.stun<=0)for(const o of P)if(o.team!=t&&!o.gk&&Math.hypot(o.x-p.x,o.z-p.z)<2.6&&Math.hypot(o.x-b.x,o.z-b.z)<2.4&&Math.random()<(t?TKL[df]:1)*dt){const d=Math.hypot(o.x-p.x,o.z-p.z)||1;p.fx=(o.x-p.x)/d;p.fz=(o.z-p.z)/d;startTackle(p);break}}
else{tx=p.hx+(b.x-p.hx)*.35;tz=p.hz+(b.z-p.hz)*.25}
const v=6*K;move(p,(tx-p.x)/3,(tz-p.z)/3,sp,dt,v,v*1.35)}
/* ---- bucle ---- */
function step(dt){clock+=dt;
for(let i=0;i<NC;i++){const j=i*3;if(cp[j+1]>-50){cp[j]+=cv[j]*dt;cp[j+1]+=cv[j+1]*dt;cp[j+2]+=cv[j+2]*dt;cv[j+1]-=10*dt;if(cp[j+1]<0)cp[j+1]=-100}}cg.attributes.position.needsUpdate=true;
if(ST=='goal'){ballStep(dt);gt-=dt;if(gt<=0){$('bn').style.display='none';place();ST='play'}return}
if(ST!='play')return;
if(freeze>0){freeze-=dt;if(freeze<=0)snd.whistle();return}
tLeft-=dt;if(tLeft<=0){tLeft=0;finish();return}
for(const p of P){p.kcd-=dt;p.tcd-=dt;p.th-=dt;p.chase=false}
for(const t of[0,1])RK[t]=P.filter(p=>p.team==t&&!p.gk).sort((a,c)=>d2(a)-d2(c));
if(!ctrl||(RK[0][0]!==ctrl&&d2(RK[0][0])<d2(ctrl)*.6))ctrl=RK[0][0];if(owner&&owner.team==0&&!owner.gk)ctrl=owner;
RK[1][0].chase=true;if(d2(RK[1][1])<196)RK[1][1].chase=true;
const sup=RK[0].find(p=>p!==ctrl);if(d2(sup)<144)sup.chase=true;if(owner)for(const p of P)if(p.team==owner.team&&p!==owner)p.chase=false;
kreq-=dt;qreq-=dt;treq-=dt;
const ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+tv.x,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+tv.z;
if(treq>0){startTackle(ctrl);treq=0}
move(ctrl,ix,iz,keys.ShiftLeft||keys.ShiftRight||tb.s,dt,6.5,9.5);
for(const p of P)if(p!==ctrl)ai(p,dt);
for(const p of P)tk(p);
if(owner&&(owner.stun>0||owner.lunge>0))owner=null;
if(owner){const o=owner,k=o.r+b.r+.1;b.x=o.x+o.fx*k;b.z=Math.max(-HW+b.r,Math.min(HW-b.r,o.z+o.fz*k));if(Math.abs(b.z)>GW)b.x=Math.max(-HL+b.r,Math.min(HL-b.r,b.x));b.vx=o.vx;b.vz=o.vz;
for(const q of P)if(q.team!=o.team&&!q.gk&&q.stun<=0&&Math.hypot(q.x-o.x,q.z-o.z)<q.r+o.r+.9&&Math.random()<1.1*dt){owner=q;q.kcd=0;break}}
else{let got=null;for(const p of P)if(p.kcd<=0&&p.stun<=0&&p.lunge<=0&&Math.hypot(b.x-p.x,b.z-p.z)<p.r+b.r+.3&&Math.hypot(b.vx-p.vx,b.vz-p.vz)<(p.gk?20:18)){got=p;break}
if(got)owner=got;else for(const p of P)hit(p)}
const bd=Math.hypot(b.x-ctrl.x,b.z-ctrl.z);
if(bd<ctrl.r+b.r+1.5&&ctrl.kcd<=0){
if(kreq>0){const dx=(b.x-ctrl.x)/bd,dz=(b.z-ctrl.z)/bd;kick(ctrl,ctrl.fx*.8+dx*.2,ctrl.fz*.8+dz*.2,21+(Math.hypot(ctrl.vx,ctrl.vz)>8?4:0));kreq=0}
else if(qreq>0){pass(ctrl,1);qreq=0}}
ballStep(dt)}
function finish(){ST='end';snd.whistle();const r=getRec(),w=score[0]>score[1];r.p++;if(w)r.w++;if(score[0]>r.best)r.best=score[0];setRec(r);
$('tt').textContent=w?'¡Victoria!':score[0]==score[1]?'Empate':'Derrota';
$('mn').innerHTML='<h2 style="font-size:36px;opacity:1">'+TM[sel.me][0]+' '+score[0]+' – '+score[1]+' '+TM[sel.op][0]+'</h2>';
$('go').textContent='Otro partido';showRec();$('ov').className=''}
function render(){
for(const p of P){const m=p.mesh;m.position.set(p.x,0,p.z);m.rotation.y=Math.atan2(p.fx,p.fz);m.rotation.x=p.lunge>0?.7:0;
const s=Math.sin(p.anim)*.9;m.legs[0].rotation.x=s;m.legs[1].rotation.x=-s;m.arms[0].rotation.x=-s*.8;m.arms[1].rotation.x=s*.8}
bm.position.set(b.x,b.r,b.z);const sp=Math.hypot(b.vx,b.vz);if(sp>.01)bm.rotateOnWorldAxis(new THREE.Vector3(b.vz,0,-b.vx).normalize(),sp*(1/60)/b.r);
if(ctrl){ring.visible=true;ring.position.x=ctrl.x;ring.position.z=ctrl.z;$('st').style.width=ctrl.stam*100+'%'}
cx+=(Math.max(-26,Math.min(26,b.x*.8))-cx)*.08;cam.position.set(cx,30,43);cam.lookAt(cx,0,3);
const m=Math.floor((1-tLeft/MATCH)*90),h=`<span style="color:${TM[sel.me][1]=='#161616'?'#ccc':TM[sel.me][1]}">${TM[sel.me][0]}</span> ${score[0]} — ${score[1]} <span style="color:${TM[sel.op][1]=='#161616'?'#ccc':TM[sel.op][1]}">${TM[sel.op][0]}</span> · ${m}′`;
if(h!==lastHud){$('sb').innerHTML=h;lastHud=h}
rd.render(sc,cam)}
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);render();requestAnimationFrame(loop)}
/* ---- menú ---- */
function showRec(){const r=getRec();$('rec').textContent='Récord: '+r.w+' victorias de '+r.p+' partidos · Más goles en un partido: '+r.best}
function preview(){const c=$('pv'),q=c.getContext('2d'),W=c.width,H=c.height;q.fillStyle='#2f8f3f';q.fillRect(0,0,W,H);q.strokeStyle='#fff8';q.lineWidth=2;q.strokeRect(4,4,W-8,H-8);q.beginPath();q.moveTo(W/2,4);q.lineTo(W/2,H-4);q.stroke();q.beginPath();q.arc(W/2,H/2,24,0,7);q.stroke();
const t=TM[sel.me],pts=[[.02,0],...FM[sel.fm]];q.font='bold 12px system-ui';q.textAlign='center';q.textBaseline='middle';
pts.forEach(([d,l],i)=>{const x=14+d*(W-28)*1.0,y=H/2+l*(H/2-18);q.fillStyle=i?t[1]:'#26c281';q.beginPath();q.arc(x,y,10,0,7);q.fill();q.strokeStyle=t[2];q.lineWidth=2;q.stroke();q.fillStyle=i&&(t[1]=='#161616'||t[1]=='#1d3f9f'||t[1]=='#12245e'||t[1]=='#d8202a'||t[1]=='#c4122e'||t[1]=='#d92b2b')?'#fff':'#111';q.fillText(i+1,x,y+1)})}
function menu(){const bt=(k,i,l,on,ex='')=>`<button data-k="${k}" data-i="${i}" class="${on?'on':''}">${ex}${l}</button>`,sw=i=>`<i class="sw" style="background:${TM[i][1]}"></i><i class="sw" style="background:${TM[i][2]}"></i>`;
$('mn').innerHTML='<h2>Tu equipo</h2><div class=row>'+TM.map((t,i)=>bt('me',i,t[0],sel.me==i,sw(i))).join('')+'</div><h2>Rival</h2><div class=row>'+TM.map((t,i)=>i==sel.me?'':bt('op',i,t[0],sel.op==i,sw(i))).join('')+'</div><h2>Alineación y dificultad</h2><div class=row>'+Object.keys(FM).map(f=>bt('fm',f,f,sel.fm==f)).join('')+'</div><div class=row>'+['easy','normal','hard'].map((d,i)=>bt('df',d,['Fácil','Normal','Difícil'][i],sel.df==d)).join('')+'</div><canvas id=pv width=300 height=190></canvas>';preview()}
$('ov').onclick=e=>{const x=e.target.closest('[data-k]');if(!x)return;const k=x.dataset.k,v=x.dataset.i;sel[k]=(k=='fm'||k=='df')?v:+v;if(sel.me==sel.op)sel.op=(sel.me+1)%8;menu()};
$('go').onclick=()=>{if(ST=='end'){ST='menu';$('tt').textContent='⚽ Football Legends 3D';$('go').textContent='Jugar';menu();return}
au();build();score=[0,0];tLeft=MATCH;ctrl=null;place();ST='play';$('ov').className='h'};
/* ---- entrada ---- */
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=1;if(e.code=='Space')kreq=.18;if(e.code=='KeyQ')qreq=.18;if(e.code=='KeyE')treq=.18});
addEventListener('keyup',e=>keys[e.code]=0);addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
let j0=null;const js=$('js');
js.onpointerdown=e=>{js.setPointerCapture(e.pointerId);j0={x:e.clientX,y:e.clientY}};
js.onpointermove=e=>{if(j0){tv.x=Math.max(-1,Math.min(1,(e.clientX-j0.x)/45));tv.z=Math.max(-1,Math.min(1,(e.clientY-j0.y)/45))}};
js.onpointerup=js.onpointercancel=()=>{j0=null;tv.x=tv.z=0};
$('bS').onpointerdown=()=>tb.s=1;$('bS').onpointerup=$('bS').onpointerleave=()=>tb.s=0;
$('bK').onpointerdown=()=>kreq=.18;$('bP').onpointerdown=()=>qreq=.18;$('bT').onpointerdown=()=>treq=.18;
build();ctrl=P[5];place();freeze=0;ring.visible=false;menu();showRec();requestAnimationFrame(loop);
</script></body></html>
