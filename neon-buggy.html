const PASS=[{x:300,c:50},{x:800,ch:[60,120]},{x:1500,c:120},{x:2500,car:3},{x:4000,ch:[100,250]},{x:6000,c:250},{x:8500,ch:[150,350]},{x:11500,car:4},{x:15000,c:400},{x:19000,ch:[250,500]},{x:24000,c:600},{x:30000,car:5}];
function claimT(i){const p=PASS[i];if(claimed.includes(i)||xp<p.x)return 0;claimed.push(i);if(p.car!=null){if(!own.includes(p.car))own.push(p.car);return '🚗 '+CARS[p.car].n}const n=p.c||Math.round(rr(p.ch[0],p.ch[1]));wallet+=n;return '+'+n+' 🪙'}
function passUI(sx){const N=PASS.length,lv=PASS.filter(p=>xp>=p.x).length,pv=lv?PASS[lv-1].x:0,nx=PASS[lv]?PASS[lv].x:pv+1,fr=lv>=N?N:lv+(xp-pv)/(nx-pv);
 const t=PASS.map((p,i)=>{const ok=xp>=p.x,dn=claimed.includes(i),ic=p.car!=null?'🚗':p.ch?'🎁':'🪙',nm=p.car!=null?CARS[p.car].n:p.ch?'Cofre':'×'+p.c,ds=p.car!=null?CARS[p.car].perk:p.ch?p.ch[0]+'–'+p.ch[1]+' 🪙':'Monedas';
  return `<div class='tr${dn?' dn':ok?' ok':''}' data-i='${i}' style='animation-delay:${i*55}ms'><b class='nm'>${i+1}</b><div class='bx'>${dn?"<u class='ck'>✔</u>":''}<div class='ic'>${ic}</div><div class='tn'>${nm}</div><small>${ds}</small><div class='st'>${dn?'COBRADO':ok?'¡COBRAR!':'🔒 '+p.x+' XP'}</div></div></div>`}).join('');
 panel(`<h1>PASE NEÓN</h1><div class='pxp'><b>Nv ${1+Math.floor(xp/1000)}</b><span>${xp} XP · ${lv}/${N} recompensas</span></div><div class='trk' id='trk'><div class='trin'><i class='pl' id='pl'></i>${t}</div></div><div class='row'><button class='go' id='all'>COBRAR TODO</button><button class='go alt' id='bk'>VOLVER</button></div>`);
 $('pn').style.maxWidth='min(96vw,780px)';const trk=$('trk');trk.scrollLeft=sx==null?Math.max(0,(PASS.findIndex((p,i)=>!claimed.includes(i))-1)*102):sx;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('pl').style.width=Math.max(0,fr*102-10)+'px'}));

const ENC=[[0x4a6bff,0xffd23a],[0x9a2bff,0x19f2ff],[0xff8a1a,0x111133]];
function spawnEnemy(){const ag=Math.random()<.35+Math.min(.3,dist/3000),col=ag?[0xff1a1a,0x000000]:ENC[Math.random()*3|0],g=new THREE.Group(),ws=buildCar(g,{c1:col[0],c2:col[1],shape:Math.random()<.5?0:2}),x=[-9,-3,3,9][Math.random()*4|0]+rr(-1,1),z=car.z-rr(110,150);g.position.set(x,0,z);S.add(g);enemies.push({g,ws,x,z,v:ag?speed*.78:rr(13,20),ag,ph:rr(0,6),dead:false})}
function toDebris(e,vz){e.dead=true;debris.push({m:e.g,v:new V3(rr(-6,6),rr(7,12),vz),w:new V3(rr(-6,6),rr(-6,6),rr(-6,6)),l:2.5})}
function stomp(e,gy){toDebris(e,-e.v);car.air=true;car.vy=11;lastVy=0;airT=0;bonus+=150;pop('¡APLASTADO! +150');burst(new V3(e.x,gy+1,e.z),18,0xffd23a,10);snd(300,.2,'square',.07,400);shake=.4}
function hitEnemy(e){toDebris(e,-speed*rr(.9,1.2));const p=new V3(e.x,1,e.z);burst(p,22,0xff6a1a,12);burst(p,10,0xffd23a,10);shake=1.1;snd(90,.4,'sawtooth',.2,-50);if(shields===0){over();return}shields--;invul=CP.fan?2.6:1.8;speed*=.55;if(!car.air){car.air=true;car.vy=6;lastVy=0}}
function updEnemies(dt,t){eT-=dt;if(eT<=0&&enemies.length<5){spawnEnemy();eT=Math.max(2,5.5-dist/500)+rr(0,2)}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead){enemies.splice(i,1);continue}
  e.z-=e.v*dt;if(e.ag&&e.z>car.z-55&&e.z<car.z+8)e.x+=Math.sign(car.x-e.x)*Math.min(Math.abs(car.x-e.x),5*dt);else e.x+=Math.sin(t*.8+e.ph)*1.5*dt;
  e.x=Math.max(-12,Math.min(12,e.x));const gy=gH(e.x,e.z);e.g.position.set(e.x,gy,e.z);e.ws.forEach(w=>w.rotation.x-=e.v*dt/.55);
  if(Math.abs(e.z-car.z)<3.6&&Math.abs(e.x-car.x)<2.1){if(car.y>gy+1.1)stomp(e,gy);else if(invul<=0){hitEnemy(e);if(st!=='play')return}}
  else if(e.z>car.z+25||e.z<car.z-260){S.remove(e.g);enemies.splice(i,1)}}}

for(let i=0;i<14;i++){const s=new THREE.Mesh(gOct,i%3?mCoin:mNit);s.scale.setScalar(.35+Math.random()*.25);const a=rr(0,6.28),r=rr(5,10);s.position.set(Math.cos(a)*r,0,Math.sin(a)*r-1);s.userData.y=rr(.5,6);lobbyG.add(s);sparks.push(s)}
